[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcpaegis"
version = "0.1.0"
description = "Static and dynamic security analysis of local MCP servers."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "typer>=0.12",
]

[project.scripts]
mcpaegis = "mcpaegis.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
# FastMCP lives in mcp 1.x. mcp 2.x renamed it to MCPServer and breaks fixtures.
runtime = [
    "mcp>=1.2,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["mcpaegis*"]

[tool.setuptools.package-data]
mcpaegis = [
    "static/taint/rules/*.yaml",
    "static/taint/rules/taint/*.yaml",
    "dynamic/ebpf/*.c",
]
