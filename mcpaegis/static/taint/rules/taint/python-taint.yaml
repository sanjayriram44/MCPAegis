rules:
  - id: mcpaegis.python.taint.shell_exec
    mode: taint
    message: Tool parameter flows into a process-execution sink
    languages: [python]
    severity: ERROR
    metadata:
      sink_type: shell_exec
    pattern-sources:
      - pattern: |
          @mcp.tool(...)
          def $FUNC(...):
            ...
      - pattern: |
          @mcp.tool()
          def $FUNC(...):
            ...
      - pattern: |
          @mcp.tool
          def $FUNC(...):
            ...
      - pattern: |
          @server.tool(...)
          def $FUNC(...):
            ...
      - pattern: |
          @server.tool()
          def $FUNC(...):
            ...
      - pattern: |
          @app.tool(...)
          def $FUNC(...):
            ...
      - pattern: |
          @app.tool()
          def $FUNC(...):
            ...
      - pattern: |
          @mcp.tool(...)
          async def $FUNC(...):
            ...
      - pattern: |
          @mcp.tool()
          async def $FUNC(...):
            ...
    pattern-sinks:
      - pattern: subprocess.$METHOD(...)
      - pattern: subprocess.run(...)
      - pattern: subprocess.Popen(...)
      - pattern: subprocess.call(...)
      - pattern: subprocess.check_output(...)
      - pattern: subprocess.check_call(...)
      - pattern: os.system(...)
      - pattern: os.popen(...)
      - pattern: os.execv(...)
      - pattern: os.execve(...)
      - pattern: os.execl(...)
      - pattern: os.spawnl(...)
      - pattern: os.spawnv(...)
      - pattern: asyncio.create_subprocess_shell(...)
      - pattern: asyncio.create_subprocess_exec(...)
    pattern-sanitizers:
      - pattern: shlex.quote(...)
      - pattern: shlex.split(...)
      - pattern: shlex.join(...)

